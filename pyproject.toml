[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luma-esp32"
version = "0.1.0"
description = "Compilador del lenguaje Luma para placas ESP32 con MicroPython"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyserial>=3.5",
]

[project.scripts]
luma = "luma.__main__:main"
luma-gui = "luma.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
